# top folder where ntuples live with the structure
# ntuple_path/SAMPLE/SYSTEMATIC.root (paths relative to the repo root)
ntuple_path: "tests/toy_files/"
results_path: "results/"

# name of NOSYS.root holding the nominal non-systematic values
nominal: NOSYS
tree_name: FilteredTree
signal_sample: "sig"
bkg_sample: "bkg"
# total events that are batched in training from all sample_sys combined
batch_size: 10_000_000

# the main data array is defined by (n_samples, n_events, vars)
# vars are min max scaled (nn inputs, cut and fit variables)
vars:
  - "m"
  - "pt1"
event_weight_var: weight
aux_vars:
  - "bkg_mod_up"
  - "bkg_mod_down"

# ratio need to add up to one
train_ratio: 0.8
valid_ratio: 0.1
test_ratio: 0.1

plot_inputs: True

# cls_nn: fit the nn output, cls_var: fit a variable (cls_var)
objective: "cls_var"
cls_var: "m"
n_bins: 5
# includes bin edges in optimization
include_bins: true

# uncertainties, the bkg modelling one is the catch of the toy
weight_systematics:
  BKG_MOD:
    sample: "bkg"
    up: "bkg_mod_up"
    down: "bkg_mod_down"
# false: train on stat uncertainties only, valid/test always use all
train_systematics: true

# results folder suffix
suffix: "mass"
# train steps
num_steps: 300
# learning rate
lr: 0.005
# can choose from linear_cycle, constant
lr_schedule: "linear_cycle"
# need to limit these updates to avoid gradient explosion
update_limit_cuts: 0.001 # for min max scaled between (0,1)

# cuts on vars to be optimized, keep variables either "above", "below"
# or below, start somewhere where the cut actually does something to
# find a gradient
opt_cuts:
  pt1:
    keep: "above"
    init: 35

# applies a scale factor to the histograms accordingly
n_k_folds: 1

# skip frames by modulo for movie
movie_batch_modulo: 5
# points to sample the kde for the movie
kde_sampling: 200
